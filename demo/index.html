<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mutant-lab demo</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../mutant-lab.css">
  <style>
    /* A stand-in for the host page: the tokens and button styles the lab borrows. */
    :root { --bg: #eeeef0; --surface: #f7f7f8; --text: #17171a; --muted: #55555e; --line: #d4d4da; --accent: #0a7d55; --accent-ink: #fff; --accent-soft: rgb(10 125 85 / 0.1); --radius: 14px; color-scheme: light; }
    @media (prefers-color-scheme: dark) { :root { --bg: #111113; --surface: #18181b; --text: #ececef; --muted: #a3a3ad; --line: #2b2b31; --accent: #3cc993; --accent-ink: #0c0c0e; --accent-soft: rgb(60 201 147 / 0.12); color-scheme: dark; } }
    body { margin: 0; padding: 32px 24px; background: var(--bg); color: var(--text); font: 17px/1.6 ui-sans-serif, system-ui, sans-serif; }
    main { max-width: 1180px; margin: 0 auto; }
    h1 { margin: 0 0 24px; font-size: 32px; letter-spacing: -0.02em; }
    .btn { display: inline-flex; align-items: center; height: 48px; padding: 0 22px; border-radius: 999px; font-size: 16px; font-weight: 560; }
    .btn--primary { background: var(--accent); color: var(--accent-ink); }
    .btn--small { height: 38px; padding: 0 16px; font-size: 14px; }
  </style>
  <script src="../mutant-lab.js" defer></script>
</head>
<body>
  <main>
    <h1>Your tests pass. Would they catch a bug?</h1>
    <div id="mutant-lab" data-worker="../mutant-lab-worker.js"></div>
  </main>
</body>
</html>
